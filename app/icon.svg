<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Soft Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#f0f4f9" />
      <stop offset="100%" stop-color="#dbe3ee" />
    </radialGradient>

    <!-- Left Hemisphere Blue Gradient -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c8ff" />
      <stop offset="50%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#6000ff" />
    </linearGradient>

    <!-- Right Hemisphere Obsidian Dark Navy Gradient -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1e" />
      <stop offset="50%" stop-color="#0f1f42" />
      <stop offset="100%" stop-color="#0055cc" />
    </linearGradient>

    <!-- Drop Shadow for 3D depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Circular Outer Disc -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGlow)" filter="url(#shadow)" />

  <!-- Inner Logo Group -->
  <g transform="translate(256, 256) scale(0.80) translate(-256, -256)">
    <!-- Left Hemisphere Shape (Cyan/Blue to Purple gradient) -->
    <path d="M 236,76 A 180,180 0 0,0 236,436 L 236,76 Z" fill="url(#leftGrad)" />
    
    <!-- Right Hemisphere Shape (Dark Obsidian Navy gradient) -->
    <path d="M 256,76 L 256,436 A 180,180 0 0,0 256,76 Z" fill="url(#rightGrad)" />
  </g>
</svg>
